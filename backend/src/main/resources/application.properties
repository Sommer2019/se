spring.application.name=backend
server.port=8080

# H2 als Datei-Datenbank, damit die Daten einen Neustart überleben
spring.datasource.url=jdbc:h2:file:./data/sedb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate legt die Tabellen anhand der @Entity-Klassen selbst an (kein SQL nötig)
spring.jpa.hibernate.ddl-auto=update
# data.sql (Testdaten) erst ausführen, nachdem Hibernate die Tabellen angelegt hat
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2-Konsole: http://localhost:8080/h2-console (JDBC-URL wie oben)
spring.h2.console.enabled=true
