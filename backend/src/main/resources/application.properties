spring.application.name=backend
server.port=8080

# H2 als Datei-Datenbank, damit die Daten einen Neustart überleben
spring.datasource.url=jdbc:h2:file:./data/sedb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Tabellen kommen aus schema.sql / data.sql, nicht aus Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# H2-Konsole: http://localhost:8080/h2-console (JDBC-URL wie oben)
spring.h2.console.enabled=true
